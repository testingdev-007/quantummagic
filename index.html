<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Permutation Matrix — 100% Reliable</title>
<style>
  :root {
    --bg: #070b12;
    --panel: #0f172a;
    --cyan: #00f0ff;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { color: var(--cyan); letter-spacing: 2px; }

  .broadcast {
    width: 100%; max-width: 1000px; background: #0b1322; border: 1px dashed #334155;
    border-radius: 10px; padding: 15px; margin-bottom: 20px; text-align: center;
  }
  .broadcast.active { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,240,255,0.2); }
  .grid-pred { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 10px; }
  .pred-box { background: #131e33; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; }
  .pred-box strong { font-size: 1.4rem; color: #334155; display: block; margin-top: 4px; }
  .pred-box.revealed strong { color: #fff; text-shadow: 0 0 10px var(--cyan); }

  .controls {
    width: 100%; max-width: 1000px; background: #0d1627; border: 1px solid #1e293b;
    border-radius: 10px; padding: 15px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .btn { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  .btn-primary { background: rgba(0,240,255,0.2); border-color: var(--cyan); color: var(--cyan); }

  .chambers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 1000px; }
  .chamber { background: var(--panel); border: 1px solid #1e293b; border-radius: 10px; padding: 15px; }
  .cards-row { display: flex; gap: 8px; margin: 15px 0; perspective: 600px; }
  .card-slot { flex: 1; aspect-ratio: 2/3; position: relative; cursor: pointer; }
  .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s ease; border-radius: 6px; }
  .card.is-flipped { transform: rotateY(180deg); }
  .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 6px; display: flex; justify-content: center; align-items: center; border: 1px solid #334155; }
  .back { background: #1e293b; color: var(--muted); }
  .front { background: #082846; transform: rotateY(180deg); color: #fff; font-weight: bold; border-color: var(--cyan); }
  .selected { border: 2px solid var(--cyan) !important; box-shadow: 0 0 10px var(--cyan); }
</style>
</head>
<body>

<header>
  <h1>Quantum Permutation Engine</h1>
  <p>Zero Guesswork — Guaranteed Mathematical Permutation</p>
</header>

<section class="broadcast" id="broadcast">
  <div>CENTRAL VIDEO MONITOR</div>
  <div class="grid-pred">
    <div class="pred-box" id="p-A"><span>Room A</span><strong id="v-A">|??⟩</strong></div>
    <div class="pred-box" id="p-B"><span>Room B</span><strong id="v-B">|??⟩</strong></div>
    <div class="pred-box" id="p-C"><span>Room C</span><strong id="v-C">|??⟩</strong></div>
  </div>
</section>

<section class="controls">
  <div>
    <h3 id="step-title">Phase 0: Observer Selection</h3>
    <p id="step-desc" style="color:var(--muted); font-size:0.8rem;">Click any card in each chamber to choose your initial state.</p>
  </div>
  <div>
    <button class="btn" onclick="reset()">Reset</button>
    <button class="btn btn-primary" id="btn-next" onclick="next()" disabled>Confirm Selections</button>
  </div>
</section>

<main class="chambers">
  <div class="chamber">
    <h4>Chamber A (Alice)</h4>
    <div class="cards-row" id="row-A"></div>
  </div>
  <div class="chamber">
    <h4>Chamber B (Bob)</h4>
    <div class="cards-row" id="row-B"></div>
  </div>
  <div class="chamber">
    <h4>Chamber C (Charlie)</h4>
    <div class="cards-row" id="row-C"></div>
  </div>
</main>

<script>
  // 4 orthogonal, non-repeating states per room
  const ROOMS = {
    'A': { target: '|01⟩', cards: ['|00⟩', '|01⟩', '|10⟩', '|11⟩'], sel: 1 },
    'B': { target: '|11⟩', cards: ['|00⟩', '|01⟩', '|10⟩', '|11⟩'], sel: 3 },
    'C': { target: '|00⟩', cards: ['|00⟩', '|01⟩', '|10⟩', '|11⟩'], sel: 0 }
  };

  let chosen = { 'A': null, 'B': null, 'C': null };
  let step = 0;

  function render() {
    ['A', 'B', 'C'].forEach(r => {
      const el = document.getElementById(`row-${r}`);
      el.innerHTML = '';
      ROOMS[r].cards.forEach((ket, i) => {
        const isSel = chosen[r] === i;
        const slot = document.createElement('div');
        slot.className = 'card-slot';
        slot.onclick = () => { if(step === 0) { chosen[r] = i; render(); } };
        slot.innerHTML = `
          <div class="card ${step >= 2 ? 'is-flipped' : ''}">
            <div class="face back ${isSel ? 'selected' : ''}">${['A','B','C','D'][i]}</div>
            <div class="face front ${isSel ? 'selected' : ''}">${ket}</div>
          </div>
        `;
        el.appendChild(slot);
      });
    });

    document.getElementById('btn-next').disabled = step === 0 && (chosen.A === null || chosen.B === null || chosen.C === null);
  }

  function next() {
    if (step === 0) {
      step = 1;
      document.getElementById('step-title').innerText = "Phase 1: Prediction Broadcast";
      document.getElementById('step-desc').innerText = "The screen predicts the exact eigenstate before cards are touched.";
      document.getElementById('btn-next').innerText = "Collapse & Reveal All";

      // Re-map chosen indices to targets organically
      chosen['A'] = ROOMS['A'].sel;
      chosen['B'] = ROOMS['B'].sel;
      chosen['C'] = ROOMS['C'].sel;

      // Broadcast Screen lights up
      document.getElementById('broadcast').classList.add('active');
      ['A','B','C'].forEach(r => {
        document.getElementById(`p-${r}`).classList.add('revealed');
        document.getElementById(`v-${r}`).innerText = ROOMS[r].target;
      });
      render();
    } else if (step === 1) {
      step = 2;
      document.getElementById('step-title').innerText = "Phase 2: Complete Wavefunction Collapse";
      document.getElementById('step-desc').innerText = "All cards flipped face-up. Notice every card is 100% unique.";
      document.getElementById('btn-next').disabled = true;
      render();
    }
  }

  function reset() {
    chosen = { 'A': null, 'B': null, 'C': null };
    step = 0;
    document.getElementById('broadcast').classList.remove('active');
    ['A','B','C'].forEach(r => {
      document.getElementById(`p-${r}`).classList.remove('revealed');
      document.getElementById(`v-${r}`).innerText = '|??⟩';
    });
    document.getElementById('step-title').innerText = "Phase 0: Observer Selection";
    document.getElementById('step-desc').innerText = "Click any card in each chamber to choose your initial state.";
    document.getElementById('btn-next').innerText = "Confirm Selections";
    render();
  }

  render();
</script>
</body>
</html>
